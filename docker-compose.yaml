version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: custos_db
    environment:
      POSTGRES_USER: custos
      POSTGRES_PASSWORD: custos_dev_password
      POSTGRES_DB: custos_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: custos_storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minioadmin_password
    ports:
      - "9000:9000"   # Minio API
      - "9001:9001"   # Minio Web UI
    volumes:
      - minio_data:/data

  volumes:
    postgres_data:
    minio_data: